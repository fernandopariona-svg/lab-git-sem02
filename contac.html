<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mundo Tuerca - Contacto</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; color: #333;">

  <header style="background-color: #1a1a1a; padding: 15px; text-align: center; color: white;">
    <h1 style="margin: 0;">Mundo Tuerca</h1>
    <p style="margin: 5px 0 0 0;">Pasión por los Autos Clásicos</p>
  </header>

  <nav style="background-color: #333; text-align: center; padding: 10px; margin-top: 5px;">
    <a href="index.html" style="color: white; text-decoration: none; margin: 0 15px;">Inicio</a>
    <a href="about.html" style="color: white; text-decoration: none; margin: 0 15px;">Nosotros</a>
    <a href="contact.html" style="color: #ff4500; text-decoration: none; font-weight: bold; margin: 0 15px;">Contacto</a>
  </nav>

  <main style="max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px;">

    <!-- Cambio realizado para la Versión A -->
    <h1>Contáctanos</h1>
    <p>¿Tienes alguna consulta o deseas compartir la historia de tu auto? Envíanos un mensaje.</p>
    
    <form style="display: flex; flex-direction: column; gap: 10px; max-width: 400px;">
      <label>Nombre:</label>
      <input type="text" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required>
      
      <label>Correo Electrónico:</label>
      <input type="email" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required>
      
      <label>Mensaje:</label>
      <textarea rows="4" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;" required></textarea>
      
      <button type="submit" style="background-color: #ff4500; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">
        Enviar
      </button>
    </form>
  </main>

  <footer style="text-align: center; margin-top: 30px; font-size: 14px; color: #666;">
    <p>&copy; 2026 Mundo Tuerca. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
